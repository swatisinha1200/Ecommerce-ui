<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile | ShopEase</title>
  </head>

  <body>
    <header>
      <div class="logo">
        <a href="index.html">ShopEase</a>
      </div>

      <nav class="navigation">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="page-header">
        <h1>My Profile</h1>
        <p>Manage your account information and preferences.</p>
      </section>

      <section class="profile">
        <aside class="profile-sidebar">
          <div class="profile-image">
            <img src="assets/profile/profile.jpg" alt="Profile picture" />
          </div>

          <h2>Swati Sinha</h2>
          <p>swati@example.com</p>

          <nav class="profile-navigation">
            <a href="profile.html">My Profile</a>
            <a href="orders.html">My Orders</a>
            <a href="wishlist.html">My Wishlist</a>
            <a href="cart.html">My Cart</a>
            <a href="login.html">Logout</a>
          </nav>
        </aside>

        <div class="profile-content">
          <section class="personal-information">
            <h2>Personal Information</h2>

            <form action="" method="post">
              <div>
                <label for="first-name">First Name</label>
                <input
                  type="text"
                  id="first-name"
                  name="first_name"
                  value="Swati"
                  autocomplete="given-name"
                  required
                />
              </div>

              <div>
                <label for="last-name">Last Name</label>
                <input
                  type="text"
                  id="last-name"
                  name="last_name"
                  value="Sinha"
                  autocomplete="family-name"
                  required
                />
              </div>

              <div>
                <label for="email">Email Address</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  value="swati@example.com"
                  autocomplete="email"
                  required
                />
              </div>

              <div>
                <label for="phone">Phone Number</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="Enter phone number"
                  autocomplete="tel"
                />
              </div>

              <div>
                <label for="date-of-birth">Date of Birth</label>
                <input type="date" id="date-of-birth" name="date_of_birth" />
              </div>

              <fieldset>
                <legend>Gender</legend>

                <label>
                  <input type="radio" name="gender" value="female" />
                  Female
                </label>

                <label>
                  <input type="radio" name="gender" value="male" />
                  Male
                </label>

                <label>
                  <input type="radio" name="gender" value="other" />
                  Other
                </label>
              </fieldset>

              <button type="submit">Save Changes</button>
            </form>
          </section>

          <section class="address-information">
            <h2>Address</h2>

            <form action="" method="post">
              <label for="address">Street Address</label>
              <textarea
                id="address"
                name="address"
                rows="4"
                placeholder="Enter your address"
                autocomplete="street-address"
              ></textarea>

              <label for="city">City</label>
              <input
                type="text"
                id="city"
                name="city"
                autocomplete="address-level2"
              />

              <label for="state">State</label>
              <input
                type="text"
                id="state"
                name="state"
                autocomplete="address-level1"
              />

              <label for="postal-code">Postal Code</label>
              <input
                type="text"
                id="postal-code"
                name="postal_code"
                autocomplete="postal-code"
              />

              <button type="submit">Save Address</button>
            </form>
          </section>

          <section class="account-actions">
            <h2>Account</h2>

            <a href="forgot-password.html">Change Password</a>
            <a href="login.html">Logout</a>
          </section>
        </div>
      </section>
    </main>

    <footer>
      <p>© 2026 ShopEase. All Rights Reserved.</p>
    </footer>
  </body>
</html>

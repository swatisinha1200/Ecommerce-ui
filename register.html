<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Account | ShopEase</title>
  </head>

  <body>
    <header>
      <div class="logo">
        <a href="index.html">ShopEase</a>
      </div>

      <nav class="navigation">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="register">
        <h1>Create Your Account</h1>

        <p>Join ShopEase and start shopping today.</p>

        <form action="" method="post">
          <fieldset>
            <legend>Personal Information</legend>

            <div class="form-group">
              <label for="first-name">First Name</label>

              <input
                type="text"
                name="first_name"
                id="first-name"
                placeholder="Enter your first name"
                autocomplete="given-name"
                required
              />
            </div>

            <div class="form-group">
              <label for="last-name">Last Name</label>

              <input
                type="text"
                name="last_name"
                id="last-name"
                placeholder="Enter your last name"
                autocomplete="family-name"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>

              <input
                type="email"
                name="email"
                id="email"
                placeholder="Enter your email address"
                autocomplete="email"
                required
              />
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>

              <input
                type="tel"
                name="phone"
                id="phone"
                placeholder="Enter your phone number"
                autocomplete="tel"
                required
              />
            </div>
          </fieldset>

          <fieldset>
            <legend>Account Information</legend>

            <div class="form-group">
              <label for="password">Password</label>

              <input
                type="password"
                name="password"
                id="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>

            <div class="form-group">
              <label for="confirm-password">Confirm Password</label>

              <input
                type="password"
                name="confirm_password"
                id="confirm-password"
                placeholder="Confirm your password"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>
          </fieldset>

          <fieldset>
            <legend>Preferences</legend>

            <div class="form-group">
              <label for="gender">Gender</label>

              <select name="gender" id="gender">
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
                <option value="prefer-not-to-say">Prefer not to say</option>
              </select>
            </div>

            <div class="form-group">
              <p>Preferred Categories</p>

              <label>
                <input type="checkbox" name="category" value="electronics" />
                Electronics
              </label>

              <label>
                <input type="checkbox" name="category" value="fashion" />
                Fashion
              </label>

              <label>
                <input type="checkbox" name="category" value="home-kitchen" />
                Home & Kitchen
              </label>
            </div>

            <div class="form-group">
              <label>
                <input type="checkbox" name="terms" required />
                I agree to the
                <a href="#">Terms & Conditions</a>
              </label>
            </div>
          </fieldset>

          <button type="submit">Create Account</button>
        </form>

        <p>
          Already have an account?
          <a href="login.html">Login here</a>
        </p>
      </section>
    </main>

    <footer>
      <p>© 2026 ShopEase. All Rights Reserved.</p>
    </footer>
  </body>
</html>
